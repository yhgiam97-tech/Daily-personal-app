<!doctype html>
<html lang="en" data-tone="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Daily Brief</title>
  <meta name="description" content="Eric's morning brief: what to wear, US markets, and today's AI lesson.">
  <meta name="theme-color" content="#22385E">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Brief">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="sky" aria-hidden="true"></div>

  <div class="navbar" id="navbar" aria-hidden="true">
    <span class="navbar-title" id="navTitle"></span>
  </div>

  <div class="ptr" id="ptr" aria-hidden="true">
    <svg viewBox="0 0 28 28" width="28" height="28">
      <g fill="currentColor">
        <rect x="12.75" y="2" width="2.5" height="7" rx="1.25" opacity="1"/>
        <rect x="12.75" y="2" width="2.5" height="7" rx="1.25" opacity=".9"  transform="rotate(45 14 14)"/>
        <rect x="12.75" y="2" width="2.5" height="7" rx="1.25" opacity=".8"  transform="rotate(90 14 14)"/>
        <rect x="12.75" y="2" width="2.5" height="7" rx="1.25" opacity=".7"  transform="rotate(135 14 14)"/>
        <rect x="12.75" y="2" width="2.5" height="7" rx="1.25" opacity=".55" transform="rotate(180 14 14)"/>
        <rect x="12.75" y="2" width="2.5" height="7" rx="1.25" opacity=".45" transform="rotate(225 14 14)"/>
        <rect x="12.75" y="2" width="2.5" height="7" rx="1.25" opacity=".35" transform="rotate(270 14 14)"/>
        <rect x="12.75" y="2" width="2.5" height="7" rx="1.25" opacity=".25" transform="rotate(315 14 14)"/>
      </g>
    </svg>
  </div>

  <main class="app" id="app">
    <header class="hero" id="hero">
      <p class="hero-day enter" id="weekday" style="--i:0"></p>
      <p class="hero-num enter" id="dateNum" style="--i:1"></p>
      <p class="hero-sub enter" style="--i:2">
        <span id="monthYear"></span>
        <span class="hero-zh" id="lunar" lang="zh-CN"></span>
      </p>

      <div class="wear enter" id="wear" style="--i:3">
        <p class="wear-lead" id="wearLead">Wear</p>
        <p class="wear-name" id="wearName"></p>
        <p class="wear-zh" id="wearZh" lang="zh-CN"></p>
        <div class="chips" id="wearChips"></div>
        <p class="wear-note" id="wearNote"></p>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </header>

    <section class="module enter" id="colourModule" style="--i:4" aria-labelledby="altTitle">
      <h2 class="module-head" id="altTitle">
        <svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M8 5.4a2 2 0 1 1 3.1 1.6c-.6.4-1.1.8-1.1 1.5v.3l6.6 4.3a1.4 1.4 0 0 1-.8 2.6H4.2a1.4 1.4 0 0 1-.8-2.6L10 8.8"/></svg>
        <span>Also works today</span>
      </h2>
      <div id="altChoices"></div>
    </section>

    <section class="module enter" style="--i:5" aria-labelledby="top3Title">
      <h2 class="module-head" id="top3Title">
        <svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.2"/><path d="m6.9 10.2 2.2 2.2 4.1-4.6"/></svg>
        <span>Top 3 today</span>
      </h2>
      <ol class="top3" id="top3"></ol>
      <button class="carry" id="carryBtn" type="button" hidden></button>
    </section>

    <section class="module enter" style="--i:6" aria-labelledby="mktTitle">
      <div class="module-head">
        <h2 id="mktTitle">
          <svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 14.5 7.5 10l3 3 6.5-7"/><path d="M13 6h4v4"/></svg>
          <span>US markets</span>
        </h2>
        <span class="module-meta" id="mktAsOf"></span>
      </div>
      <div id="market"></div>
    </section>

    <section class="module enter" style="--i:7" aria-labelledby="learnTitle">
      <div class="module-head">
        <h2 id="learnTitle">
          <svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.8 11.6 8l5.2 2-5.2 2L10 17.2 8.4 12l-5.2-2 5.2-2Z"/></svg>
          <span>Today's lesson</span>
        </h2>
        <span class="module-meta" id="learnStreak"></span>
      </div>
      <div id="learn"></div>
    </section>

    <footer class="foot">
      <p id="footMeta"></p>
      <button class="foot-btn" id="refreshBtn" type="button">Refresh</button>
    </footer>
  </main>

  <!-- Tabs arrive in v2 (Pipeline, Career, Life). -->
  <nav class="tabbar" id="tabbar" hidden aria-label="Sections">
    <a href="#" aria-current="page">Today</a>
  </nav>

  <script src="app.js" defer></script>
</body>
</html>
