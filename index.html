<!doctype html>
<html lang="en" data-tone="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Daily Brief</title>
  <meta name="description" content="Eric's morning brief: what to wear, US markets, and today's AI lesson.">
  <meta name="theme-color" content="#22385E">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Brief">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="sky" aria-hidden="true"></div>

  <div class="navbar" id="navbar">
    <button class="nav-back" id="navBack" type="button" hidden>
      <svg viewBox="0 0 12 20" aria-hidden="true"><path d="M10 2 2 10l8 8"/></svg>
      <span>Lessons</span>
    </button>
    <span class="navbar-title" id="navTitle" aria-hidden="true"></span>
  </div>

  <div class="ptr" id="ptr" aria-hidden="true">
    <svg viewBox="0 0 28 28" width="28" height="28">
      <g fill="currentColor">
        <rect x="12.75" y="2" width="2.5" height="7" rx="1.25" opacity="1"/>
        <rect x="12.75" y="2" width="2.5" height="7" rx="1.25" opacity=".9"  transform="rotate(45 14 14)"/>
        <rect x="12.75" y="2" width="2.5" height="7" rx="1.25" opacity=".8"  transform="rotate(90 14 14)"/>
        <rect x="12.75" y="2" width="2.5" height="7" rx="1.25" opacity=".7"  transform="rotate(135 14 14)"/>
        <rect x="12.75" y="2" width="2.5" height="7" rx="1.25" opacity=".55" transform="rotate(180 14 14)"/>
        <rect x="12.75" y="2" width="2.5" height="7" rx="1.25" opacity=".45" transform="rotate(225 14 14)"/>
        <rect x="12.75" y="2" width="2.5" height="7" rx="1.25" opacity=".35" transform="rotate(270 14 14)"/>
        <rect x="12.75" y="2" width="2.5" height="7" rx="1.25" opacity=".25" transform="rotate(315 14 14)"/>
      </g>
    </svg>
  </div>

  <main class="app" id="app">
    <!-- ================= Today ================= -->
    <section class="view view-today" id="view-today" aria-label="Today">
      <header class="hero" id="hero">
        <button class="today-pill pressable" id="todayPill" type="button" hidden>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg>Today
        </button>
        <p class="hero-day enter" id="weekday" style="--i:0"></p>
        <p class="hero-num enter" id="dateNum" style="--i:1"></p>
        <p class="hero-sub enter" style="--i:2">
          <span id="monthYear"></span>
          <span class="hero-zh" id="lunar" lang="zh-CN"></span>
        </p>

        <div class="wear enter" id="wear" style="--i:3">
          <p class="wear-lead" id="wearLead">Wear</p>
          <p class="wear-name" id="wearName"></p>
          <p class="wear-zh" id="wearZh" lang="zh-CN"></p>
          <div class="chips" id="wearChips"></div>
          <p class="callout" id="chipCallout" aria-live="polite"></p>
          <p class="wear-note" id="wearNote"></p>
        </div>

        <div class="week enter" id="week" style="--i:4" role="group" aria-label="Choose a day to preview its colours"></div>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </header>

      <section class="module enter" id="colourModule" style="--i:5" aria-labelledby="altTitle">
        <div class="module-head">
          <h2 id="altTitle">
            <svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M8 5.4a2 2 0 1 1 3.1 1.6c-.6.4-1.1.8-1.1 1.5v.3l6.6 4.3a1.4 1.4 0 0 1-.8 2.6H4.2a1.4 1.4 0 0 1-.8-2.6L10 8.8"/></svg>
            <span id="altTitleText">Also works today</span>
          </h2>
          <button class="head-link" id="openCalendar" type="button">Calendar</button>
        </div>
        <div id="altChoices"></div>
      </section>

      <section class="module enter" style="--i:6" aria-labelledby="top3Title">
        <div class="module-head">
          <h2 id="top3Title">
            <svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.2"/><path d="m6.9 10.2 2.2 2.2 4.1-4.6"/></svg>
            <span>Top 3 today</span>
          </h2>
        </div>
        <ol class="top3" id="top3"></ol>
        <button class="carry" id="carryBtn" type="button" hidden></button>
      </section>

      <section class="module enter" style="--i:7" aria-labelledby="mktTitle">
        <div class="module-head">
          <h2 id="mktTitle">
            <svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 14.5 7.5 10l3 3 6.5-7"/><path d="M13 6h4v4"/></svg>
            <span>US markets</span>
          </h2>
          <span class="module-meta" id="mktAsOf"></span>
        </div>
        <div id="market"></div>
      </section>

      <section class="module enter" style="--i:8" aria-labelledby="learnTitle">
        <div class="module-head">
          <h2 id="learnTitle">
            <svg class="ico" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.8 11.6 8l5.2 2-5.2 2L10 17.2 8.4 12l-5.2-2 5.2-2Z"/></svg>
            <span>Today's lesson</span>
          </h2>
          <button class="head-link" id="openLessons" type="button">All lessons</button>
        </div>
        <div id="learn"></div>
      </section>

      <footer class="foot">
        <p id="footMeta"></p>
        <button class="foot-btn" id="refreshBtn" type="button">Refresh</button>
      </footer>
    </section>

    <!-- ================= Colours ================= -->
    <section class="view view-page" id="view-colours" aria-label="Colours" hidden>
      <h1 class="large-title" id="coloursTitle">Colours</h1>
      <section class="module" aria-labelledby="calMonth">
        <div class="cal-head">
          <button class="icon-btn pressable" id="calPrev" type="button" aria-label="Previous month">
            <svg viewBox="0 0 12 20" aria-hidden="true"><path d="M9 3 3 10l6 7"/></svg>
          </button>
          <h2 class="cal-month" id="calMonth"></h2>
          <button class="icon-btn pressable" id="calNext" type="button" aria-label="Next month">
            <svg viewBox="0 0 12 20" aria-hidden="true"><path d="m3 3 6 7-6 7"/></svg>
          </button>
        </div>
        <div class="cal-dow" aria-hidden="true"></div>
        <div class="cal-grid" id="calGrid" role="grid" aria-labelledby="calMonth"></div>
      </section>
      <section class="module" id="calDetail" aria-live="polite"></section>
      <section class="module" aria-labelledby="legendTitle">
        <div class="module-head"><h2 id="legendTitle"><span>How your chart works</span></h2></div>
        <div id="legend"></div>
      </section>
    </section>

    <!-- ================= Lessons ================= -->
    <section class="view view-page" id="view-lessons" aria-label="Lessons" hidden>
      <div id="lessonList">
        <h1 class="large-title" id="lessonsTitle">Lessons</h1>
        <p class="page-sub" id="lessonsSub"></p>
        <div id="weeks"></div>
      </div>
      <div class="lesson-page" id="lessonDetail" hidden></div>
    </section>
  </main>

  <nav class="tabbar" id="tabbar" aria-label="Sections">
    <button class="tab" type="button" data-view="today" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg>
      <span>Today</span>
    </button>
    <button class="tab" type="button" data-view="colours">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/><circle cx="9" cy="14.5" r="1.4" class="fillme"/><circle cx="15" cy="14.5" r="1.4" class="fillme"/></svg>
      <span>Colours</span>
    </button>
    <button class="tab" type="button" data-view="lessons">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2 13.9 9l6 2.1-6 2.1L12 19l-1.9-5.8-6-2.1 6-2.1Z"/></svg>
      <span>Lessons</span>
    </button>
  </nav>

  <script src="app.js" defer></script>
</body>
</html>
