<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Daily Brief</title>
  <meta name="description" content="Eric's morning brief: what to wear, US markets, and today's AI lesson.">
  <meta name="theme-color" content="#2B3140">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Brief">
  <link rel="preload" href="fonts/big-shoulders-display.woff" as="font" type="font/woff" crossorigin>
  <link rel="preload" href="fonts/ibm-plex-sans.woff" as="font" type="font/woff" crossorigin>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="hero" id="hero">
    <div class="hero-top">
      <p class="weekday" id="weekday"></p>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </div>

    <div class="date">
      <span class="date-num" id="dateNum"></span>
      <span class="date-side">
        <span id="monthYear"></span>
        <span class="lunar" id="lunar" lang="zh-CN"></span>
      </span>
    </div>

    <div class="wear" id="wear">
      <p class="wear-lead">Wear</p>
      <p class="wear-name" id="wearName"></p>
      <p class="wear-note" id="wearNote"></p>
      <p class="tomorrow" id="tomorrow" hidden>
        <span class="tomorrow-dot" id="tomorrowDot" aria-hidden="true"></span>
        <span id="tomorrowText"></span>
      </p>
    </div>
  </header>

  <main class="sheet" id="sheet">
    <section class="block" aria-labelledby="top3Title">
      <h2 id="top3Title">Top 3 today</h2>
      <ol class="top3" id="top3"></ol>
      <button class="link-btn" id="carryBtn" type="button" hidden></button>
    </section>

    <section class="block" aria-labelledby="mktTitle">
      <div class="block-head">
        <h2 id="mktTitle">US markets</h2>
        <p class="asof" id="mktAsOf"></p>
      </div>
      <div id="market"></div>
    </section>

    <section class="block" aria-labelledby="learnTitle">
      <div class="block-head">
        <h2 id="learnTitle">Today's lesson</h2>
        <p class="asof" id="learnStreak"></p>
      </div>
      <div id="learn"></div>
    </section>

    <footer class="foot">
      <button class="refresh" id="refreshBtn" type="button">Refresh</button>
      <p class="foot-meta" id="footMeta"></p>
    </footer>
  </main>

  <!-- Tabs arrive in v2 (Pipeline, Career, Life). -->
  <nav class="tabbar" id="tabbar" hidden aria-label="Sections">
    <a href="#" aria-current="page">Today</a>
  </nav>

  <script src="app.js" defer></script>
</body>
</html>
